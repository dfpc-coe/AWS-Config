name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: ./release "$TAG" > RELEASE

      - name: Github Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE
